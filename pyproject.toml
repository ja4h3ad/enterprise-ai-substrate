[project]
name = "contractgraph"
version = "0.1.0"
description = "Trustworthy graph-grounded agentic retrieval for synthetic enterprise contracts"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "ContractGraph contributors" }]
dependencies = [
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3.0,<4",
  "networkx>=3.4,<4",
  "opentelemetry-api>=1.44,<2",
  "opentelemetry-sdk>=1.44,<2",
  "pydantic>=2.12,<3",
]

[project.scripts]
contractgraph = "contractgraph.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contractgraph"]

[tool.uv]
cache-dir = ".contractgraph/uv-cache"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
